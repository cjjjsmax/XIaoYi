spring:
  datasource:
    url: jdbc:mysql://localhost:3306/xy?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:1111}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  web:
    resources:
      static-locations: classpath:/META-INF/resources/, classpath:/resources/, classpath:/static/, classpath:/public/, file:./demo/uploads/

server:
  port: 8080
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

zhipu:
  ai:
    api-key: ${ZHIPU_API_KEY:test_key}
    api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
    model: GLM-5V-Turbo

jwt:
  secret-key: ${JWT_SECRET_KEY:campus_secondhand_secret_key_campus_secondhand_secret_key}
  expiration-time: ${JWT_EXPIRATION_TIME:86400000}